<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LuxLights Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #4ecca3; --text: #e9ecef; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
            height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #luxapp-ui {
            width: 100%; max-width: 400px; height: 100%; background: radial-gradient(circle at top, #1e1e3f 0%, #1a1a2e 100%);
            padding: 30px 20px; display: flex; flex-direction: column; transition: background 0.8s ease;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--accent); font-weight: 300; }
        .lux-control-group { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; opacity: 0.6; }
        .lux-btn-mode {
            flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.1); background: transparent;
            color: white; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.3s;
        }
        .lux-btn-mode:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        input[type=range] { width: 100%; height: 6px; border-radius: 5px; background: #333; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: var(--accent); border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 10px rgba(78, 204, 163, 0.4); }
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .color-dot { height: 45px; border-radius: 12px; border: none; cursor: pointer; transition: 0.2s; }
        .color-dot:active { transform: scale(0.9); }
        #status-bar { font-size: 10px; margin-top: 10px; opacity: 0.7; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="luxapp-ui">
        <div class="header">
            <h1>LUXLIGHTS</h1>
            <div id="status-bar">Connecting to Global Bridge...</div>
        </div>

        <div id="lux-main-view">
            <div class="lux-control-group">
                <label>Brightness</label>
                <input type="range" id="lux-bri" min="0" max="255" value="128" oninput="luxSetBrightness(this.value)">
            </div>

            <div class="lux-control-group">
                <label>Quick Scenes</label>
                <div class="color-grid">
                    <button class="color-dot" style="background: #ff4d4d;" onclick="luxSetColor(255,0,0)"></button>
                    <button class="color-dot" style="background: #4dff88;" onclick="luxSetColor(0,255,0)"></button>
                    <button class="color-dot" style="background: #4d94ff;" onclick="luxSetColor(0,0,255)"></button>
                    <button class="color-dot" style="background: #ffcc4d;" onclick="luxSetColor(255,200,0)"></button>
                </div>
            </div>

            <button class="lux-btn-mode" style="width: 100%; border-color: var(--accent); color: var(--accent); margin-top: 20px;" onclick="luxToggleLamp()">POWER TOGGLE</button>
            
            <button class="lux-btn-mode" style="width: 100%; border:none; color: #666; font-size: 10px; margin-top: 10px;" onclick="resetKey()">Reset Access Key</button>
        </div>
    </div>

    <script>
        // --- SECURE CONFIGURATION ---
        const MQTT_HOST = "io.adafruit.com";
        const MQTT_PORT = 443;
        const MQTT_USER = "kabeer41"; 
        
        // This MUST match the 'Device Topic' in your WLED settings.
        const WLED_DEVICE_TOPIC = `${MQTT_USER}/feeds/luxlamp`; 
        
        // WLED strictly looks for JSON commands on the /api sub-topic.
        const COMMAND_TOPIC = WLED_DEVICE_TOPIC + "/api";

        let mqttClient;
        let MQTT_PASS = localStorage.getItem("lux_key");

        function initMQTT() {
            // Ask for the key if it's not saved in the browser
            if (!MQTT_PASS) {
                MQTT_PASS = prompt("Welcome to LuxLights! Please enter your Access Key:");
                if (MQTT_PASS) {
                    localStorage.setItem("lux_key", MQTT_PASS);
                } else {
                    document.getElementById('status-bar').innerHTML = "Access Key Required to Connect";
                    document.getElementById('status-bar').style.color = "#ff4d4d";
                    return;
                }
            }

            // Generate a random Client ID so your phone and lamp don't kick each other off
            const clientId = "LuxWeb_" + Math.random().toString(16).substr(2, 5);
            mqttClient = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientId);

            mqttClient.connect({
                useSSL: true, 
                userName: MQTT_USER, 
                password: MQTT_PASS,
                onSuccess: () => {
                    document.getElementById('status-bar').innerHTML = "● GLOBAL ACTIVE";
                    document.getElementById('status-bar').style.color = "#4ecca3";
                    
                    // We subscribe to the base topic just to monitor connection, 
                    // but we will PUBLISH to the /api topic.
                    mqttClient.subscribe(WLED_DEVICE_TOPIC); 
                },
                onFailure: (err) => { 
                    document.getElementById('status-bar').innerHTML = "○ Connection Failed - Check Key"; 
                    document.getElementById('status-bar').style.color = "#ff4d4d";
                    console.log("MQTT Connection Error:", err);
                    
                    // Clear the bad key so the user can try again on refresh
                    localStorage.removeItem("lux_key");
                }
            });
        }

        function luxPostData(data) {
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(JSON.stringify(data));
                
                // THE CRITICAL FIX: Sending strictly to the /api mailbox
                message.destinationName = COMMAND_TOPIC; 
                
                mqttClient.send(message);
            }
        }

        // --- LAMP COMMANDS ---
        function luxToggleLamp() { 
            luxPostData({ "on": "t", "transition": 7 }); 
        }
        
        function luxSetBrightness(v) { 
            luxPostData({ "bri": parseInt(v), "transition": 7 }); 
        }
        
        function luxSetColor(r, g, b) { 
            luxPostData({ "on": true, "seg": [{ "col": [[r, g, b]] }], "transition": 7 }); 
            // Update the UI background to match the lamp
            document.getElementById("luxapp-ui").style.background = `radial-gradient(circle at top, rgba(${r},${g},${b},0.15) 0%, #1a1a2e 100%)`;
        }

        function resetKey() {
            localStorage.removeItem("lux_key");
            location.reload();
        }

        // Start connection when the page loads
        document.addEventListener("DOMContentLoaded", initMQTT);
    </script>
</body>
</html>
