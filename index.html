<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LuxLights - Simple Toggle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        body { 
            background-color: #1a1a2e; color: white; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; text-align: center;
        }
        h1 { margin: 0; font-size: 32px; letter-spacing: 2px; color: #4ecca3; }
        #status { margin: 15px 0 40px 0; font-size: 14px; color: #ff4d4d; letter-spacing: 1px; }
        .power-btn { 
            background-color: transparent; border: 2px solid #4ecca3; color: #4ecca3;
            padding: 20px 40px; font-size: 18px; font-weight: bold; border-radius: 12px; 
            cursor: pointer; transition: 0.2s; letter-spacing: 2px; margin-bottom: 30px;
        }
        .power-btn:active { transform: scale(0.95); background-color: rgba(78, 204, 163, 0.1); }
        .reset-btn {
            background: none; border: none; color: #666; font-size: 12px; text-decoration: underline; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>LUXLIGHTS</h1>
    <div id="status">○ Waiting for Key...</div>
    
    <button class="power-btn" onclick="toggleLamp()">POWER TOGGLE</button>
    <button class="reset-btn" onclick="resetKey()">Reset Access Key</button>

    <script>
        // --- CONFIGURATION ---
        const MQTT_HOST = "io.adafruit.com";
        const MQTT_PORT = 443;
        const MQTT_USER = "kabeer41";
        const LAMP_TOPIC = "kabeer41/feeds/luxapp"; // Must match WLED Device Topic exactly

        let mqttClient;
        let MQTT_PASS = localStorage.getItem("lux_key");

        function initMQTT() {
            // Securely ask for the key if it isn't saved
            if (!MQTT_PASS) {
                MQTT_PASS = prompt("Please enter your NEW Adafruit Access Key:");
                if (MQTT_PASS) {
                    localStorage.setItem("lux_key", MQTT_PASS);
                } else {
                    document.getElementById('status').innerHTML = "○ Access Key Required";
                    return;
                }
            }

            document.getElementById('status').innerHTML = "○ Connecting...";

            const clientId = "LuxWeb_" + Math.random().toString(16).substr(2, 5);
            mqttClient = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, clientId);

            mqttClient.onConnectionLost = function(responseObject) {
                if (responseObject.errorCode !== 0) {
                    document.getElementById('status').innerHTML = "○ Disconnected";
                    document.getElementById('status').style.color = "#ff4d4d";
                }
            };

            mqttClient.connect({
                useSSL: true, 
                userName: MQTT_USER, 
                password: MQTT_PASS,
                onSuccess: function() {
                    document.getElementById('status').innerHTML = "● CONNECTED TO CLOUD";
                    document.getElementById('status').style.color = "#4ecca3";
                },
                onFailure: function(err) {
                    document.getElementById('status').innerHTML = "○ Connection Failed - Check Key";
                    document.getElementById('status').style.color = "#ff4d4d";
                    console.log("Error:", err);
                    // Clear the bad key so the user can try again
                    localStorage.removeItem("lux_key");
                }
            });
        }

        function toggleLamp() {
            if (mqttClient && mqttClient.isConnected()) {
                // Send plain text "T" directly to the feed
                const message = new Paho.MQTT.Message("T");
                message.destinationName = LAMP_TOPIC;
                mqttClient.send(message);
            }
        }

        function resetKey() {
            localStorage.removeItem("lux_key");
            location.reload();
        }

        // Start connection on load
        document.addEventListener("DOMContentLoaded", initMQTT);
    </script>
</body>
</html>
